[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uploadio-api"
version = "0.1.0"
description = "Uploadio publishing API"
authors = [{name = "Vojtěch Klepáček"}]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "redis>=5,<7", "celery>=5.4,<6", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "cryptography>=44", "boto3>=1.36,<2", "sentry-sdk[fastapi,celery]>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "aiosqlite>=0.20,<1", "respx>=0.22,<1", "mypy>=1.14,<3", "pip-audit>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
