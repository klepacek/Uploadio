services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uploadio
      POSTGRES_PASSWORD: uploadio
      POSTGRES_DB: uploadio
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uploadio"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://uploadio:uploadio@postgres:5432/uploadio
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://uploadio:uploadio@postgres:5432/uploadio
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    env_file: .env
    environment: *backend-env
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    build: ./backend
    env_file: .env
    environment: *backend-env
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres:
  redis:
