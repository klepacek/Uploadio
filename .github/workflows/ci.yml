name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uploadio
          POSTGRES_PASSWORD: uploadio
          POSTGRES_DB: uploadio
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U uploadio" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check . && ruff format --check . && pytest
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
