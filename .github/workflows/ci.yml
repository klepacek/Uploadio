name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uploadio
          POSTGRES_PASSWORD: uploadio
          POSTGRES_DB: uploadio
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U uploadio" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.lock && pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check . && ruff format --check . && mypy app && pytest
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://uploadio:uploadio@localhost:5432/uploadio
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run lint && npm run typecheck && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet && docker compose build
      - run: |
          docker compose up -d api frontend worker scheduler
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:3000/ --output /dev/null
          docker compose ps
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
